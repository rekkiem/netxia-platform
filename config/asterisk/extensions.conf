; =====================================================================
; extensions.conf — Enrutamiento hacia AudioSocket (voice-service)
; =====================================================================
[from-trunk]
exten => _+569XXXXXXXX,1,NoOp(Llamada entrante de ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(CHANNEL(language)=es)
 same => n,AudioSocket(${UNIQUEID},voice-service:8090)
 same => n,Hangup()

[internal]
exten => _X.,1,Dial(PJSIP/${EXTEN}@trunk-chile)
