; =====================================================================
; sip.conf — Troncal SIP para Chile
; Reemplazar TU_USUARIO/TU_PASSWORD con las credenciales del proveedor.
; =====================================================================
[general]
context=public
allowoverlap=no
udpbindaddr=0.0.0.0:5060
tcpenable=yes
tcpbindaddr=0.0.0.0:5060
transport=udp,tcp
srvlookup=yes

[trunk-chile]
type=peer
host=sip.proveedor.cl
username=TU_USUARIO
secret=TU_PASSWORD
fromuser=TU_USUARIO
fromdomain=sip.proveedor.cl
context=from-trunk
insecure=port,invite
nat=yes
canreinvite=no
dtmfmode=rfc2833
disallow=all
allow=ulaw
allow=alaw
allow=g722
