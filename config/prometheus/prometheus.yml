global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:8000"]
  - job_name: "conversation-engine"
    static_configs:
      - targets: ["conversation-engine:8000"]
  - job_name: "llm-service"
    static_configs:
      - targets: ["llm-service:8000"]
  - job_name: "voice-service"
    static_configs:
      - targets: ["voice-service:8000"]
  - job_name: "whatsapp-service"
    static_configs:
      - targets: ["whatsapp-service:8000"]
  - job_name: "spam-filter"
    static_configs:
      - targets: ["spam-filter:8000"]
