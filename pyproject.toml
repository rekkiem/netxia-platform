[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --cov=services --cov-report=term-missing --cov-report=xml --cov-fail-under=65"

[tool.coverage.run]
source = ["services"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
