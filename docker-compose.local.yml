# =====================================================================
# docker-compose.local.yml — Overlay SOLO para desarrollo local.
#
# Uso (siempre con -f, nunca reemplaza al archivo base):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# Qué hace este overlay:
#   1. Publica los puertos de cada servicio FastAPI al host, para poder
#      pegarles con curl/Postman/Thunder Client directamente desde
#      Windows sin pasar por Traefik (que en local está desactivado).
#   2. Limita la memoria de Ollama a un tope razonable para una máquina
#      de 14GB RAM total (Windows + Docker Desktop/WSL2 + el resto del
#      stack).
#   3. NO toca la configuración de producción: docker-compose.yml se
#      mantiene intacto para el despliegue en el VPS (scripts/deploy.sh
#      NO referencia este archivo).
#
# IMPORTANTE: no subas este archivo a producción ni lo uses en el VPS
# (los límites de memoria y puertos aquí son para tu máquina, no para
# ahí). En este repo vive solo como ayuda de desarrollo.
# =====================================================================

services:
  gateway:
    ports:
      - "8001:8000"

  conversation-engine:
    ports:
      - "8002:8000"

  llm-service:
    ports:
      - "8003:8000"

  whatsapp-service:
    ports:
      - "8004:8000"

  spam-filter:
    ports:
      - "8005:8000"

  crm-service:
    ports:
      - "8006:8000"

  notification:
    ports:
      - "8007:8000"

  analytics:
    ports:
      - "8008:8000"

  identity:
    ports:
      - "8009:8000"

  voice-service:
    ports:
      - "8010:8000"  # healthcheck HTTP (8090 de AudioSocket ya está publicado en el compose base)

  keycloak:
    ports:
      - "8080:8080"

  # --- Ajuste de memoria para 14GB RAM totales en la máquina ---
  # Con Windows + Docker Desktop (WSL2) + el resto de contenedores, no
  # sobra margen para correr Mistral 7B cómodamente. Se limita Ollama a
  # 4GB, suficiente para gemma2:2b + llama3.2:3b cargados a la vez.
  # Si necesitas Mistral 7B, sube este límite (y el de Docker Desktop)
  # o ciérralo cuando no lo uses: `docker compose exec ollama ollama stop mistral:7b`.
  ollama:
    mem_limit: 4g
    deploy:
      resources:
        limits:
          memory: 4G
