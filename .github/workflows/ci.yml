name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias de desarrollo
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check services tests

      - name: Type-check (mypy, no bloqueante en MVP)
        run: mypy services --ignore-missing-imports || true

      - name: Tests con cobertura
        run: pytest tests/ --cov=services --cov-report=xml --cov-fail-under=65

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build-images:
    needs: lint-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - gateway
          - conversation-engine
          - llm-service
          - voice-service
          - whatsapp-service
          - spam-filter
          - crm-service
          - analytics
          - notification
          - identity
    steps:
      - uses: actions/checkout@v4

      - name: Log in a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./services
          file: ./services/${{ matrix.service }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }},ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
